# Reusable CI for course repos. A course calls it with:
#
#   jobs:
#     ci:
#       uses: constatza/beamer-ntua/.github/workflows/course-ci.yml@<tag>
#       permissions: {contents: write}
#
# The class and the build/release scripts are installed at the same tag as this
# workflow (`beamer-ref` defaults to it), so one pin moves everything together.
name: Course CI

on:
  workflow_call:
    inputs:
      beamer-ref:
        description: beamer-ntua ref providing the class and scripts. Keep equal to the tag this workflow is called at.
        type: string
        default: v0.2.0  # must equal the tag this file is released under
      release-answers:
        description: Attach *_answers.pdf files to the public release.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NTUA_BEAMER_REF: ${{ inputs.beamer-ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-base texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-luatex texlive-pictures latexmk biber lmodern \
            fonts-libertinus
      - name: Install class and course tools
        run: |
          curl -fsSL -o /tmp/install-class.sh \
            "https://raw.githubusercontent.com/constatza/beamer-ntua/${NTUA_BEAMER_REF}/scripts/install-class.sh"
          NTUA_BEAMER_BIN_DIR="$HOME/.local/bin" sh /tmp/install-class.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: build-course
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/.build/*.log
            **/.build/latexmk.out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install course tools
        run: |
          curl -fsSL -o /tmp/install-class.sh \
            "https://raw.githubusercontent.com/constatza/beamer-ntua/${NTUA_BEAMER_REF}/scripts/install-class.sh"
          # tools only: TEXMFHOME is a scratch dir because this job does not compile
          TEXMFHOME="$RUNNER_TEMP/texmf" NTUA_BEAMER_BIN_DIR="$HOME/.local/bin" sh /tmp/install-class.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ANSWERS: ${{ inputs.release-answers && '1' || '0' }}
        run: release-course "${GITHUB_REF_NAME}"
