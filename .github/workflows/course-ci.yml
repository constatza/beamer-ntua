# Reusable CI for course repos. A course calls it with:
#
#   jobs:
#     ci:
#       uses: constatza/beamer-ntua/.github/workflows/course-ci.yml@<tag>
#       permissions: {contents: write}
#
# The class and the build/release scripts are installed at the same tag as this
# workflow (`beamer-ref` defaults to it), so one pin moves everything together.
name: Course CI

on:
  workflow_call:
    inputs:
      beamer-ref:
        description: beamer-ntua ref providing the class and scripts. Keep equal to the tag this workflow is called at.
        type: string
        default: v0.2.1  # must equal the tag this file is released under
      tex-packages:
        description: Space-separated CTAN packages missing from the medium TeX Live scheme.
        type: string
        default: pgfplots titlesec
      release-answers:
        description: Attach *_answers.pdf files to the public release.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NTUA_BEAMER_REF: ${{ inputs.beamer-ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Medium scheme (~1 GB) covers every package the courses use except the few in
    # `tex-packages`. Pinned by digest so a rebuilt `latest-medium` cannot change results;
    # refresh the digest by hand (docker pull texlive/texlive:latest-medium; docker inspect).
    container: texlive/texlive:latest-medium@sha256:b0cf44a1f512f850552be0595ff5f0dc3d9ae85c73ccce1ccec9401eee5b63bb
    steps:
      - uses: actions/checkout@v4
      - name: Install extra TeX packages
        env:
          TEX_PACKAGES: ${{ inputs.tex-packages }}
        run: |
          # a single flaky CTAN mirror must not fail the build: use the redirector and retry
          tlmgr option repository https://mirror.ctan.org/systems/texlive/tlnet
          for attempt in 1 2 3; do
            tlmgr install $TEX_PACKAGES && exit 0
            echo "tlmgr attempt $attempt failed" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Install class and course tools
        run: |
          curl -fsSL -o /tmp/install-class.sh \
            "https://raw.githubusercontent.com/constatza/beamer-ntua/${NTUA_BEAMER_REF}/scripts/install-class.sh"
          NTUA_BEAMER_BIN_DIR="$HOME/.local/bin" sh /tmp/install-class.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: build-course
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/.build/*.log
            **/.build/latexmk.out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install course tools
        run: |
          curl -fsSL -o /tmp/install-class.sh \
            "https://raw.githubusercontent.com/constatza/beamer-ntua/${NTUA_BEAMER_REF}/scripts/install-class.sh"
          # tools only: TEXMFHOME is a scratch dir because this job does not compile
          TEXMFHOME="$RUNNER_TEMP/texmf" NTUA_BEAMER_BIN_DIR="$HOME/.local/bin" sh /tmp/install-class.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ANSWERS: ${{ inputs.release-answers && '1' || '0' }}
        run: release-course "${GITHUB_REF_NAME}"
