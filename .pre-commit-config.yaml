repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, refactor, test, build, ci, chore, perf, style, revert]
  # this repo's own hook definitions, run from the working tree
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no AI attribution in commit messages
        entry: (?i)co-authored-by:.*(claude|anthropic|openai|codex|copilot|gemini)|generated (with|by) .*(claude|codex|copilot)|noreply@anthropic\.com
        language: pygrep
        stages: [commit-msg]
