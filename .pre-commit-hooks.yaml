# Hooks other course repos consume with:
#   - repo: https://github.com/constatza/beamer-ntua
#     rev: <tag>
#     hooks: [{id: course-layout}, {id: no-built-artifacts}, {id: no-ai-attribution}]
- id: course-layout
  name: course layout (main.tex per target, TOPICS.toml paths, pin agreement)
  entry: scripts/check-course-layout
  language: script
  pass_filenames: false
  files: ^(TOPICS\.toml|\.pre-commit-config\.yaml|\.github/workflows/ci\.yml|(presentations|notes|exercises)/)

- id: no-built-artifacts
  name: no built PDFs or build directories
  entry: built artifacts must not be committed (build-course writes them to .build/ and dist/)
  language: fail
  files: (^|/)(\.build|dist)/|^(presentations|notes|exercises)/[^/]+/(main|answers)\.pdf$|\.gif$

- id: no-ai-attribution
  name: no AI attribution in commit messages
  entry: (?i)co-authored-by:.*(claude|anthropic|openai|codex|copilot|gemini)|generated (with|by) .*(claude|codex|copilot)|noreply@anthropic\.com
  language: pygrep
  stages: [commit-msg]
